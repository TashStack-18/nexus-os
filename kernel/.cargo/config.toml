[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
# Frame pointers make the panic handler's backtrace walk possible.
rustflags = ["-C", "force-frame-pointers=yes"]

[target.x86_64-unknown-none]
# Frame pointers for backtraces; a static (non-PIE) image at 1 MiB, because
# GRUB loads it as-is without applying relocations.
rustflags = ["-C", "force-frame-pointers=yes", "-C", "relocation-model=static", "-C", "code-model=kernel"]
